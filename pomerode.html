<!DOCTYPE html>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Pomerode</h1>
    </header>

    <div class="timeline">
        <div class="timeline-year" id="year-2025">
            <h2>2025</h2>
            <div class="timeline-event">
                <h3>[Março]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/20250316134153665_pomerode.jpg" alt="Pomerode 2025" class="location-image" title="Pomerode">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/20250316134154075_pomerode.jpg" alt="Pomerode 2025" class="location-image" title="Pomerode">

                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/20250316134154969_pomerode.jpg" alt="Pomerode 2025" class="location-image" title="Pomerode">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/20250320144411393_pomerode.jpg" alt="Pomerode 2025" class="location-image" title="Pomerode">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />

            </span>
        </div>
