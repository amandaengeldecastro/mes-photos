<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itapoá</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Itapoá</h1>
    </header>

    <div class="timeline">
        <div class="timeline-year" id="year-2023">
            <h2>2023</h2>
            <div class="timeline-event">
                <h3>[Julho]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_20230715_155116_249_itapoa.jpg" alt="2023" class="location-image" title="Itapoa">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_20230715_172023_305_itapoa.jpg" alt="2023" class="location-image" title="Itapoa">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_20230715_130631_670_itapoa.jpg" alt="2023" class="location-image" title="Itapoa">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_20230715_182025_579_itapoa.jpg" alt="2023" class="location-image" title="Itapoa">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();" aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>
</body>

</html>
