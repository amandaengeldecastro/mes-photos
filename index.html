<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amanda Engel de Castro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=Syne:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "DM Sans", sans-serif;
  background: #0a0a0a;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

.sidebar {
  width: 260px;
  flex-shrink: 0;
  height: 100vh;
  background: #0f0f0f;
  border-right: 0.5px solid rgba(255,255,255,0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 44px 24px 32px;
  position: relative;
  z-index: 10;
  overflow-y: auto;
}
.sidebar::-webkit-scrollbar { display: none; }
.sidebar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
}

.avatar-wrap { position: relative; margin-bottom: 20px; }
.avatar-wrap::before {
  content: '';
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1);
}
.avatar {
  width: 84px; height: 84px;
  border-radius: 50%;
  object-fit: cover;
  display: block;
  border: 1.5px solid rgba(255,255,255,0.18);
  background: #1a1a1a;
}

.sidebar-name {
  font-family: "DM Serif Display", serif;
  font-size: 1.2rem;
  color: rgba(255,255,255,0.92);
  text-align: center;
  line-height: 1.25;
  margin-bottom: 6px;
}
.sidebar-role {
  font-size: 10px;
  font-weight: 500;
  color: rgba(255,255,255,0.32);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 6px;
}
.sidebar-location {
  font-size: 10px;
  color: rgba(255,255,255,0.22);
  letter-spacing: 0.06em;
  text-align: center;
  margin-bottom: 28px;
}

.s-rule {
  width: 28px; height: 0.5px;
  background: rgba(255,255,255,0.12);
  margin: 0 auto 28px;
}

.nav { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.nav-link {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 13px;
  border-radius: 8px;
  text-decoration: none;
  color: rgba(255,255,255,0.55);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.01em;
  border: 0.5px solid transparent;
  transition: all 0.17s ease;
}
.nav-link:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.9);
}
.nav-link svg {
  width: 15px; height: 15px;
  flex-shrink: 0;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.7;
}
.nav-link .arrow { margin-left: auto; font-size: 10px; opacity: 0.3; }

.main {
  flex: 1;
  height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.bg-photo { position: absolute; inset: 0; }
.bg-photo img {
  width: 100%; height: 100%;
  object-fit: cover;
  filter: brightness(0.38) saturate(0.85);
  object-position: center 60%;
}
.bg-photo::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.45) 100%);
}

.main-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 32px;
}
.main-preface {
  font-family: "Special Elite", monospace;
  font-size: clamp(0.82rem, 1.3vw, 0.95rem);
  color: rgba(255,255,255,0.6);
  line-height: 2;
  margin-bottom: 28px;
  max-width: 400px;
  text-align: center;
  letter-spacing: 0.02em;
}
.main-rule {
  width: 32px; height: 1px;
  background: rgba(255,255,255,0.2);
  margin: 0 auto 20px;
}

.sidebar-info { display: none; }

@media (max-width: 700px) {
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    flex-direction: column;
    position: relative;
  }

  
  .main {
    position: fixed;
    inset: 0;
    z-index: 0;
  }
  .bg-photo img {
    filter: brightness(0.32) saturate(0.8);
    object-position: center 15%;
  }

  
  .main-content {
    position: fixed;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    padding: 0 32px;
    z-index: 5;
  }
  .main-preface {
    font-size: 0.83rem;
    line-height: 1.9;
    max-width: 100%;
    color: rgba(255,255,255,0.65);
  }

  
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: auto;
    border-right: none;
    border-bottom: 0.5px solid rgba(255,255,255,0.1);
    background: rgba(10,10,10,0.82);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    padding: 20px 24px 20px;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    z-index: 10;
  }
  .sidebar::before { display: none; }

  
  .avatar-wrap { margin-bottom: 0; margin-right: 14px; flex-shrink: 0; }
  .avatar { width: 52px; height: 52px; }
  .avatar-wrap::before { inset: -3px; }

  
  .sidebar-info {
    display: block;
    flex: 1;
  }
  .sidebar-name { font-size: 1rem; text-align: left; margin-bottom: 2px; }
  .sidebar-role { text-align: left; margin-bottom: 1px; }
  .sidebar-location { text-align: left; margin-bottom: 0; }

  
  .sidebar > .sidebar-name,
  .sidebar > .sidebar-role,
  .sidebar > .sidebar-location,
  .sidebar > .s-rule { display: none; }

  
  .nav {
    flex-direction: row;
    width: 100%;
    margin-top: 14px;
    gap: 8px;
  }
  .nav-link {
    flex: 1;
    justify-content: center;
    padding: 10px 8px;
    border-radius: 10px;
    font-size: 12px;
    background: rgba(255,255,255,0.06);
    border: 0.5px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
    gap: 7px;
  }
  .nav-link .arrow { display: none; }
}
</style>
</head>
<body>

<aside class="sidebar">

      src="https://avatars.githubusercontent.com/amandaengeldecastro"

      onerror="this.style.background='#1e1e1e'">
  </div>

  
  <div class="sidebar-info">
    <p class="sidebar-name">Amanda Engel de Castro</p>
    <p class="sidebar-role">IT Analyst</p>
    <p class="sidebar-location">Curitiba · Brasil</p>
  </div>

  
  <p class="sidebar-name">Amanda Engel<br>de Castro</p>

    <a href="https://www.linkedin.com/in/amandaengeldecastro/" target="_blank" class="nav-link">

      LinkedIn
      <span class="arrow">↗</span>

  </nav>

<main class="main">

    <img src="./images/locations/BR/PR/iguazu_falls.jpg" alt="Cataratas do Iguaçu">

  <div class="main-content">

    </p>
    <div class="main-rule"></div>
  </div>
</main>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/mes-photos/sw.js');
  </script>
</body>
</html>
