<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bombas</title>
    <link rel="stylesheet" href="city-styles.css">
    <link rel="stylesheet" href="auth-social.css" />
</head>

<body class="auth-loading">
    <div class="nav-wrap">
        <a href="maps.html" class="nav-main-btn">← Voltar</a>
    </div>

    <header>
        <h1>Bombas</h1>
        <div class="city-label">Bombinhas — SC</div>
        <div class="city-divider"></div>
    </header>

    <div class="timeline">
        <div class="timeline-year" id="year-2010">
            <h2>2010</h2>
            <div class="timeline-event">
                <h3>[Janeiro]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/OgAAAMNwlxWhetqAy3XkbqSUuvOsFASsT8D9qnh0HwBCi0qA5KNoWMW9TBue-WzxxdydBHf3O8yXvVRBbXtRA5tTh2EAm1T1UJP3Q3BPXKItcvBddOhrrzpJnqtj.jpg" class="location-image" >
                </div>
            </div>
        </div>
    </div>

    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();" aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="social.js"></script>
</body>
</html>
