<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra Velha</title>
    <link rel="stylesheet" href="city-styles.css">
  <link rel="stylesheet" href="auth-social.css" />
</head>

<body class="auth-loading" onclick="closeDropdown(event)">
    <div class="nav-wrap">
        <button class="nav-main-btn" onclick="toggleDropdown(event)">← Voltar</button>
        <div class="nav-dropdown" id="navDropdown">
            <a href="index.html" class="nav-option">Home</a>
            <a href="maps.html" class="nav-option">Maps</a>
        </div>
    </div>

    <header>
        <h1>Barra Velha</h1>
        <div class="city-divider"></div>
    </header>

    <div class="timeline">
        <!-- Ano 2025 -->
        <div class="timeline-year" id="year-2025">
            <h2>2025</h2>
            <div class="timeline-event">
                <h3>[Julho]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/DSC_0026.JPG" alt="Barra Velha 2025" class="location-image" title="Barra Velha">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/DSC_0044.JPG" alt="Barra Velha 2025" class="location-image" title="Barra Velha">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/DSC_0053.JPG" alt="Barra Velha 2025" class="location-image" title="Barra Velha">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/DSC_0058.JPG" alt="Barra Velha 2025" class="location-image" title="Barra Velha">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/DSC_0016hotel_flamboyant.JPG" alt="Hotel Flamboyant - Barra Velha" class="location-image" title="Hotel Flamboyant - Barra Velha">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/DSC_0020_barra_velha.jpg" alt="Barra Velha 2025" class="location-image" title="Barra Velha">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/DSC_0032barra_velha.jpg" alt="Barra Velha 2025" class="location-image" title="Barra Velha">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/DSC_0051_barra_velha.jpg" alt="Barra Velha 2025" class="location-image" title="Barra Velha">
                </div>
            </div>
        </div>
    </div>

    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();" aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>

    <script src="script.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="social.js"></script>
</body>
</html>
