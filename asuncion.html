<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Garuva</title>
    <link rel="stylesheet" href="city-styles.css">
  <link rel="stylesheet" href="auth-social.css" />
</head>

<body class="auth-loading" onclick="closeDropdown(event)">
    <div class="nav-wrap">
        <a href="maps.html" class="nav-main-btn">← Voltar</a>
    </div>

    <header>
        <h1>Asunción</h1>
        <div class="city-divider"></div>
    </header>

    <div class="timeline">
        <!-- Ano 2025 -->
        <div class="timeline-year" id="year-2013">
            <h2>2013</h2>
            <div class="timeline-event">
                <h3>[Outubro]</h3>
                <div class="timeline-images">


                    <img onclick="openModal(this.src)" src="./images/locations/PY/palácio_deLos_lopes_asunción_2013.jpg"
                        alt="Asunción" class="location-image">
                    <img onclick="openModal(this.src)"
                        src="./images/locations/PY/panteón_nacional_deLos_héroes_asunción_2013.jpg" alt="Asunción"
                        class="location-image">
                    <img onclick="openModal(this.src)"
                        src="./images/locations/PY/IMG-20140515-WA0023.jpg" alt="Asunción"
                        class="location-image">

                </div>
            </div>
        </div>
    </div>

    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();"
                    aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();"
                    aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>

    <script src="script.js"></script>
  <script src="app.js"></script>
</body>

</html>
