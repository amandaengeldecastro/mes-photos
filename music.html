<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .nav-header {
            background: #000;
            padding: 1rem 0;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .nav {
            display: flex;
            justify-content: center;
            gap: 2rem;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .nav-item {
            text-decoration: none;
            color: white;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-family: "DM Sans", sans-serif;
        }
        
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .nav-item.active {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .timeline {
            margin-top: 80px;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%;
            margin-bottom: 15px;
        }
        
        .video-container iframe,
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 4px;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 15px;
        }
        
    @media (max-width: 768px) {
      .nav {
        gap: 1rem;
        padding: 0 1rem;
        flex-wrap: nowrap;
      }
      
      .nav-item {
        padding: 0.4rem 0.8rem;
        font-size: 14px;
        white-space: nowrap;
      }
      
      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .nav {
        gap: 0.5rem;
        padding: 0 0.5rem;
      }
      
      .nav-item {
        padding: 0.3rem 0.6rem;
        font-size: 13px;
      }
    }

    @media (max-width: 360px) {
      .nav-item {
        padding: 0.3rem 0.4rem;
        font-size: 12px;
      }
    }
            
            .video-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="nav-header">
        <nav class="nav">
            <a href="home.html" class="nav-item">HOME</a>
            <a href="maps.html" class="nav-item">MAPS</a>

    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
