  <style>
    /* — Cabeçalho — */
    .music-title-area {
      text-align: center;
      padding: 72px 24px 32px;
    }

    .music-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .music-heading {
      font-family: "DM Serif Display", serif;
      font-size: 2.1rem;
      color: #fff;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .music-divider {
      width: 28px;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 16px auto 0;
    }

    /* — Timeline de música (estilo próprio com borda lateral) — */
    .timeline {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    .timeline-year {
      margin-bottom: 48px;
      border-left: 2px solid rgba(255, 255, 255, 0.12);
      padding-left: 24px;
      position: relative;
    }

    .timeline-year::before {
      content: '';
      position: absolute;
      left: -5px;
      top: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
    }

    .timeline-year h2 {
      font-family: "DM Serif Display", serif;
      font-size: 1.4rem;
      font-weight: 400;
      color: #fff;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    /* — Vídeos — */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .video-container iframe,
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* — Responsivo — */
    @media (max-width: 600px) {
      .music-heading {
        font-size: 1.75rem;
      }

      .timeline {
        padding: 16px 14px 48px;
      }

      .timeline-year {
        padding-left: 18px;
        margin-bottom: 36px;
      }

      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 360px) {
      .music-heading {
        font-size: 1.4rem;
      }
    }
  </style>
