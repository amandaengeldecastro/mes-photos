<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111110;
      font-family: "DM Sans", sans-serif;
      min-height: 100vh;
      color: #fff;
    }

    /* — Botão flutuante de voltar — */
    .nav-wrap {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }

    .nav-main-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.7);
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.02em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .nav-main-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .nav-dropdown {
      margin-top: 6px;
      background: rgba(22, 22, 20, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .nav-dropdown.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .nav-option {
      display: block;
      width: 100%;
      padding: 9px 16px;
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.65);
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .nav-option:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .nav-option + .nav-option {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* — Cabeçalho — */
    .music-title-area {
      text-align: center;
      padding: 72px 24px 32px;
    }

    .music-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .music-heading {
      font-family: "DM Serif Display", serif;
      font-size: 2.1rem;
      color: #fff;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .music-divider {
      width: 28px;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 16px auto 0;
    }

    /* — Timeline — */
    .timeline {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 20px 60px;
    }

    .timeline-year {
      margin-bottom: 48px;
      border-left: 2px solid rgba(255, 255, 255, 0.12);
      padding-left: 24px;
      position: relative;
    }

    .timeline-year::before {
      content: '';
      position: absolute;
      left: -5px;
      top: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
    }

    .timeline-year h2 {
      font-family: "DM Serif Display", serif;
      font-size: 1.4rem;
      font-weight: 400;
      color: #fff;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    /* — Vídeos — */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }

    .video-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .video-container iframe,
    .video-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* — Responsivo — */
    @media (max-width: 600px) {
      .music-heading {
        font-size: 1.75rem;
      }

      .timeline {
        padding: 16px 14px 48px;
      }

      .timeline-year {
        padding-left: 18px;
        margin-bottom: 36px;
      }

      .video-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 360px) {
      .music-heading {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body onclick="closeDropdown(event)">

  <!-- Botão flutuante de voltar -->
  <div class="nav-wrap">
    <button class="nav-main-btn" onclick="toggleDropdown(event)">← Voltar</button>
    <div class="nav-dropdown" id="navDropdown">
      <a href="index.html" class="nav-option">Home</a>
      <a href="maps.html" class="nav-option">Maps</a>
    </div>
  </div>

  <!-- Cabeçalho -->
  <div class="music-title-area">

      <div class="video-grid">
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/2_llcn_kgVY" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/dUhaVTSwOVw" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/HoVQ4CekR5g" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/JzaWkP4Vt9g" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/D6eSVhCMJd4" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/brrGCou4WZo" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/6pB7Al942FY" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/bujxpBLOB6I" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/s9ZA5BdieU0" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/XBb40GbfmK4" allowfullscreen></iframe>
        </div>
        <div class="video-container">
          <iframe src="https://www.youtube.com/embed/juD2m01fluc" allowfullscreen></iframe>
        </div>
      </div>
    </div>

    

  </div>

  <script>
    function toggleDropdown(e) {
      e.stopPropagation();
      document.getElementById('navDropdown').classList.toggle('open');
    }

    function closeDropdown(e) {
      document.getElementById('navDropdown').classList.remove('open');
    }
  </script>
</body>
</html>
