<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maps</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="apple-touch-icon" href="icons/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <link rel="stylesheet" href="auth-social.css" />
</head>
<body class="map-body auth-loading">
  <div id="pwaSplash" style="display:none;position:fixed;inset:0;z-index:99999;background:#0a0a0a;">
    <img src="https://firebasestorage.googleapis.com/v0/b/maps-1464e.firebasestorage.app/o/images%2Flocations%2FBR%2FPR%2Figuazu_falls.jpg?alt=media"
         style="width:100%;height:100%;object-fit:cover;object-position:center;"
         alt="" />
  </div>
  <script>
    if (window.matchMedia('(display-mode: standalone)').matches) {
      var s = document.getElementById('pwaSplash');
      s.style.display = 'block';
      window.addEventListener('load', function () {
        s.style.transition = 'opacity 0.9s ease';
        s.style.opacity = '0';
        setTimeout(function () { s.remove(); }, 900);
      });
    }
  </script>

  <div class="info-box" id="infoBox">
    <div class="info-box-header">
      <span class="info-box-title">Timeline</span>
      <button class="toggle-button" id="toggleBtn">−</button>
    </div>
    <div class="city-list" id="cityList">

      <div class="city-list-pinned">
        <a href="city.html?cidade=fozdoiguacu"><span class="pin-icon">🏠</span> Foz do Iguaçu — PR</a>
        <a href="city.html?cidade=curitiba"><span class="pin-icon">📍</span> Curitiba — PR</a>
        <a href="music.html"><span class="pin-icon">🔊</span> Music</a>
        <a href="pets.html"><span class="pin-icon">🐾</span> Pets</a>
      </div>

    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/mes-photos/service-worker.js');
  </script>
  <script src="firebase-loader.js"></script>
</body>
</html>
