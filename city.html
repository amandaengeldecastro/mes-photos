<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Carregando...</title>
    <link rel="stylesheet" href="city-styles.css">
    <link rel="stylesheet" href="auth-social.css">
</head>
<body class="auth-loading" onclick="closeDropdown(event)">

    <div class="nav-wrap">
        <a href="maps.html" class="nav-main-btn">← Voltar</a>
    </div>

    <header>
        <h1 id="cityTitle"> </h1>
        <div class="city-divider"></div>
    </header>

    <div class="timeline" id="timeline">
        <div class="city-loading">Carregando fotos...</div>
    </div>

    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();" aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>

    <script src="gallery.js"></script>
    <script src="locations-data.js"></script>
    <script>
    (function () {
        var MONTHS = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                      'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

        var slug     = new URLSearchParams(window.location.search).get('cidade') || '';
        var cityName = slug;

        function initHeader() {
            var loc = (typeof locations !== 'undefined') &&
                locations.find(function(l) {
                    return l.link === 'city.html?cidade=' + slug;
                });
            if (loc) cityName = loc.title.split(' — ')[0];
            document.getElementById('cityTitle').textContent = cityName;
            document.title = cityName;
        }

        function buildTimeline(photos) {
            var timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            if (!photos.length) {
                timeline.innerHTML = '<p style="color:rgba(255,255,255,0.4);padding:40px 20px">Nenhuma foto encontrada.</p>';
                return;
            }

            // Group: year → month → eventTitle
            var groups = {};
            photos.forEach(function(p) {
                var key = p.year + '__' + p.month + '__' + (p.eventTitle || '');
                if (!groups[key]) groups[key] = { year: p.year, month: p.month, eventTitle: p.eventTitle || '', photos: [] };
                groups[key].photos.push(p);
            });

            var sorted = Object.values(groups).sort(function(a, b) {
                if (b.year !== a.year) return b.year - a.year;
                if (b.month !== a.month) return b.month - a.month;
                return 0;
            });

            var currentYear = null;
            var yearDiv = null;

            sorted.forEach(function(group) {
                if (group.year !== currentYear) {
                    currentYear = group.year;
                    yearDiv = document.createElement('div');
                    yearDiv.className = 'timeline-year';
                    yearDiv.id = 'year-' + group.year;
                    yearDiv.innerHTML = '<h2>' + group.year + '</h2>';
                    timeline.appendChild(yearDiv);
                }

                var event = document.createElement('div');
                event.className = 'timeline-event';

                var label = group.eventTitle
                    ? '[' + MONTHS[group.month] + '] ' + group.eventTitle
                    : '[' + MONTHS[group.month] + ']';

                var h3 = document.createElement('h3');
                h3.textContent = label;
                event.appendChild(h3);

                var imagesDiv = document.createElement('div');
                imagesDiv.className = 'timeline-images';

                group.photos
                    .sort(function(a, b) { return (a.order || 0) - (b.order || 0); })
                    .forEach(function(photo) {
                        var img = document.createElement('img');
                        img.src       = photo.url;
                        img.alt       = cityName;
                        img.title     = photo.title || '';
                        img.className = 'location-image';
                        img.onclick   = (function(src) {
                            return function() { openModal(src); };
                        })(photo.url);
                        imagesDiv.appendChild(img);
                    });

                event.appendChild(imagesDiv);
                yearDiv.appendChild(event);
            });

            if (window.setupLazyLoading) setupLazyLoading();
        }

        document.addEventListener('DOMContentLoaded', initHeader);

        document.addEventListener('userLoggedIn', function() {
            if (typeof db === 'undefined' || !slug) return;

            db.collection('photos').doc(slug).collection('entries').get()
                .then(function(snapshot) {
                    var photos = snapshot.docs.map(function(d) {
                        return Object.assign({ id: d.id }, d.data());
                    });
                    photos.sort(function(a, b) {
                        if (b.year !== a.year) return b.year - a.year;
                        if (b.month !== a.month) return b.month - a.month;
                        return (a.order || 0) - (b.order || 0);
                    });
                    buildTimeline(photos);
                })
                .catch(function(err) {
                    document.getElementById('timeline').innerHTML =
                        '<p style="color:rgba(255,100,100,0.8);padding:40px 20px">Erro ao carregar fotos.</p>';
                    console.error(err);
                });
        });
    })();
    </script>
    <script src="firebase-loader.js"></script>
</body>
</html>
