<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Carregando...</title>
    <link rel="stylesheet" href="city-styles.css">
    <link rel="stylesheet" href="auth-social.css">
</head>
<body class="auth-loading" onclick="closeDropdown(event)">

    <div class="nav-wrap">
        <a href="maps.html" class="nav-main-btn">← Voltar</a>
    </div>

    <header>
        <h1 id="cityTitle"> </h1>
        <div class="city-divider"></div>
    </header>

    <div class="timeline" id="timeline">
        <div class="city-loading">Carregando fotos...</div>
    </div>

    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();" aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>

    <script src="gallery.js"></script>
    <script>
    (function () {
        var slug     = new URLSearchParams(window.location.search).get('cidade') || '';
        var cityName = slug;

        document.addEventListener('userLoggedIn', function() {
            if (typeof db === 'undefined' || !slug) return;

            db.collection('cities').doc(slug).get()
                .then(function(cityDoc) {
                    if (cityDoc.exists) {
                        cityName = cityDoc.data().name || slug;
                    }
                    document.getElementById('cityTitle').textContent = cityName;
                    document.title = cityName;

                    var editBtn = document.createElement('button');
                    editBtn.className = 'city-name-edit-btn';
                    editBtn.innerHTML = '✎';
                    editBtn.title     = 'Editar nome da cidade';
                    editBtn.onclick = function() {
                        var newName = prompt('Nome da cidade:', cityName);
                        if (newName !== null && newName.trim() && newName.trim() !== cityName) {
                            db.collection('cities').doc(slug).update({ name: newName.trim() })
                                .then(function() {
                                    cityName = newName.trim();
                                    document.getElementById('cityTitle').textContent = cityName;
                                    document.title = cityName;
                                })
                                .catch(function(err) { alert('Erro ao salvar: ' + err.message); });
                        }
                    };
                    document.getElementById('cityTitle').insertAdjacentElement('afterend', editBtn);
                })
                .catch(function(err) { console.error(err); });
        });
    })();
    </script>
    <script src="firebase-loader.js"></script>
</body>
</html>
