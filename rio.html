<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rio de Janeiro</title>
    <link rel="stylesheet" href="city-styles.css">
  <link rel="stylesheet" href="auth-social.css" />
</head>

<body class="auth-loading" onclick="closeDropdown(event)">
    <div class="nav-wrap">
        <a href="maps.html" class="nav-main-btn">← Voltar</a>
    </div>

    <header>
        <h1>Rio de Janeiro</h1>
        <div class="city-divider"></div>
    </header>

    <div class="timeline">
        <!-- Ano 2025 -->
        <div class="timeline-year" id="year-2014">
            <h2>2014</h2>
            <div class="timeline-event">
                <h3>[Maio]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/carlos_drummond_2014.jpg"
                        alt="Carlos Drummond" class="location-image"
                        title="Estátua de Carlos Drummond de Andrade - Copacabana">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/copacabana_2014.jpg"
                        alt="Copacabana" class="location-image" title="Praia de Ipanema">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/cristo_redentor_2014.jpg"
                        alt="Cristo Redentor" class="location-image" title="Cristo Redentor">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/fundacao_oswaldo_cruz_2014.jpg"
                        alt="Fundação Oswaldo Cruz" class="location-image" title="Fundação Oswaldo Cruz - Zona Norte">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/lapa_2014.jpg" alt="Lapa"
                        class="location-image" title="Lapa">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/morro_alemao_2014.jpg"
                        alt="Morro do Alemão" class="location-image" title="Morro do Alemão">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/pao_de_acucao_2014.jpg"
                        alt="Pão de Açúcar" class="location-image" title="Pão de Açucar">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/IMG-20140522-WA0075.jpg"
                        alt="Barra da Tijuca" class="location-image" title="Barra da Tijucar">

                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/IMG_20141125_010300.jpg"
                        alt="Barra da Tijuca" class="location-image">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/IMG_20141125_121916.jpg"
                        alt="Barra da Tijuca" class="location-image">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/IMG_20141125_014131.jpg"
                        alt="Barra da Tijuca" class="location-image">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/IMG_20141125_012637.jpg"
                        alt="Barra da Tijuca" class="location-image">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/RJ/IMG_20141125_010839.jpg"
                        alt="Barra da Tijuca" class="location-image">


                </div>
            </div>
        </div>
    </div>

    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();"
                    aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();"
                    aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>

    <script src="script.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="social.js"></script>
</body>

</html>
