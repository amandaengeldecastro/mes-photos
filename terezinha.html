<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Terezinha de Itaipu</title>
    <link rel="stylesheet" href="city-styles.css">
  <link rel="stylesheet" href="auth-social.css" />
</head>
<body class="auth-loading" onclick="closeDropdown(event)">
    <div class="nav-wrap">
        <a href="maps.html" class="nav-main-btn">← Voltar</a>
    </div>

    <header>
        <h1>Santa Terezinha de Itaipu</h1>
        <div class="city-divider"></div>
    </header>
    <div class="timeline">
        <div class="timeline-year" id="year-2023">
            <h2>2023</h2>
            <div class="timeline-event">
                <h3>[Maio]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)"
                        src="./images/locations/BR/PR/IMG_20230514_164147_151-santa_terezinha_de_itaipu.jpg"
                        alt="Santa Terezinha de Itaipu" class="location-image" title="Santa Terezinha de Itaipu">
                </div>
            </div>
        </div>
        <div class="timeline-year" id="year-2018">
            <h2>2018</h2>
            <div class="timeline-event">
                <h3>[Outubro]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_0189.JPG"
                        alt="Santa Terezinha de Itaipu" class="location-image" title="Santa Terezinha de Itaipu">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/FB_IMG_16346560162888134.jpg"
                        class="location-image">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_0218-1.jpg"
                        class="location-image">
                    
                </div>
            </div>
            <div class="timeline-event">
                <h3>[Maio]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/FB_IMG_16346560670649086.jpg"
                        alt="Santa Terezinha de Itaipu" class="location-image" title="Santa Terezinha de Itaipu">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_9180.JPG"
                        class="location-image">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_9482.JPG"
                        class="location-image">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_9330.JPG"
                        class="location-image">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_9424.JPG"
                        class="location-image">
                </div>
            </div>
        </div>
    </div>
    
    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();"
                    aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();"
                    aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>
    
    <script src="script.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="social.js"></script>
</body>
</html>
