<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Posadas</title>
    <link rel="stylesheet" href="city-styles.css">
  <link rel="stylesheet" href="auth-social.css" />
</head>

<body class="auth-loading" onclick="closeDropdown(event)">
    <div class="nav-wrap">
        <a href="maps.html" class="nav-main-btn">← Voltar</a>
    </div>

    <header>
        <h1>Posadas</h1>
        <div class="city-divider"></div>
    </header>

    <div class="timeline">
        <div class="timeline-year" id="year-2014">
            <h2>2014</h2>
            <div class="timeline-event">
                <h3>[Dezembro]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/AR/fuerza_bruta_car_ba_2014.jpg"
                        alt="Buenas Aires" class="location-image" title="Fuerza Bruta - Hard Rock Café">
                    <img onclick="openModal(this.src)" src="./images/locations/AR/fuerza_bruta_ba_2014.jpg"
                        alt="Buenas Aires" class="location-image" title="Fuerza Bruta - Hard Rock Café">
                    <img onclick="openModal(this.src)" src="./images/locations/AR/planetario_2014.jpg"
                        alt="Buenas Aires" class="location-image" title="Planetário">
                    <img onclick="openModal(this.src)" src="./images/locations/AR/el_caminito_2014.jpg"
                        alt="Buenas Aires" class="location-image" title="El Caminito">
                    <img onclick="openModal(this.src)" src="./images/locations/AR/plaza_2014.jpg" alt="Buenas Aires"
                        class="location-image" title="Buenas Aires">
                    <img onclick="openModal(this.src)" src="./images/locations/AR/floralis_2014.jpg" alt="Buenas Aires"
                        class="location-image" title="Buenas Aires">


                </div>
            </div>
        </div>
    </div>

    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();"
                    aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();"
                    aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>

    <script src="script.js"></script>
  <script src="app.js"></script>
</body>

</html>
