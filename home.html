<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amanda Engel de Castro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "DM Sans", sans-serif;
    }
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    .bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.35);
      object-position: center 60%;
    }
    .content {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 24px;
    }
    .hero {
      text-align: center;
      margin-bottom: 32px;
    }
    .hero-name {
      font-family: "DM Serif Display", serif;
      font-size: 2.1rem;
      font-weight: 400;
      color: #fff;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
    }
    .hero-sub {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.05em;
      margin: 0;
    }
    .hero-divider {
      width: 28px;
      height: 2px;
      background: rgba(255, 255, 255, 0.35);
      margin: 18px auto 0;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 340px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: #fff;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .card-icon {
      font-size: 20px;
      flex-shrink: 0;
    }
    .card-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 500;
      margin: 0;
    }
    .card-desc {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin: 0;
    }
    @media (max-width: 480px) {
      .hero-name {
        font-size: 1.75rem;
      }
      .cards {
        max-width: 100%;
      }
    }
    @media (max-width: 360px) {
      .hero-name {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg">
    <img src="./images/locations/BR/PR/iguazu_falls.jpg" alt="Cataratas do Iguaçu - Foz do Iguaçu">
  </div>
  <div class="content">
    <div class="hero">
      <h1 class="hero-name">Amanda Engel de Castro</h1>
      <p class="hero-sub">Curitiba, Paraná · Brasil</p>
      <div class="hero-divider"></div>
    </div>
    <div class="cards">
      <a href="maps.html" class="card">
        <span class="card-icon">🗺️</span>
        <div class="card-text">
          <p class="card-title">Maps</p>
        </div>
      </a>
      <a href="https://www.linkedin.com/in/amandaengeldecastro/" target="_blank" class="card">
        <span class="card-icon">💼</span>
        <div class="card-text">
          <p class="card-title">LinkedIn</p>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
