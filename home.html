<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amanda Engel de Castro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .nav-header {
      background: #000;
      padding: 1rem 0;
      text-align: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      align-items: center;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .nav-item {
      text-decoration: none;
      color: white;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: all 0.3s ease;
      font-family: "DM Sans", sans-serif;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.2);
    }

    .main-content {
      margin-top: 80px;
      padding: 3rem 2rem;
      display: flex;
      justify-content: center;
    }

    .profile-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 2rem;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      font-size: 20px;
      color: #1d4ed8;
      flex-shrink: 0;
      font-family: "DM Sans", sans-serif;
    }

    .profile-name {
      font-family: "DM Sans", sans-serif;
      font-weight: 500;
      font-size: 17px;
      margin: 0;
      color: #111;
    }

    .profile-location {
      font-family: "DM Sans", sans-serif;
      font-size: 13px;
      color: #666;
      margin: 4px 0 0;
    }

    .profile-divider {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 0 0 16px;
    }

    .linkedin-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px;
      background: #0077b5;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-family: "DM Sans", sans-serif;
      font-size: 14px;
      font-weight: 500;
      box-sizing: border-box;
      transition: background 0.2s;
    }

    .linkedin-button:hover {
      background: #005885;
    }

    @media (max-width: 768px) {
      .nav {
        flex-direction: column;
        gap: 1rem;
      }

      .main-content {
        padding: 2rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="nav-header">
    <nav class="nav">
      <a href="home.html" class="nav-item active">HOME</a>
      <a href="maps.html" class="nav-item">MAPS</a>
      <a href="music.html" class="nav-item">MUSIC</a>
      <a href="pets.html" class="nav-item">PETS</a>
    </nav>
  </div>

  <main class="main-content">
    <div class="profile-card">
      <div class="profile-header">
        <div class="profile-avatar">AC</div>
        <div>
          <p class="profile-name">Amanda Engel de Castro</p>
          <p class="profile-location">Curitiba, Paraná · Brasil</p>
        </div>
      </div>
      <hr class="profile-divider" />
      <a href="https://www.linkedin.com/in/amandaengeldecastro/" target="_blank" class="linkedin-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
        Ver perfil no LinkedIn
      </a>
    </div>
  </main>
</body>
</html>
