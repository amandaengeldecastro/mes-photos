<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santa Helena de Uairen</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Santa Helena de Uairen</h1>
    </header>

    <div class="timeline">
        <div class="timeline-year" id="year-2025">
            <h2>2016</h2>
            <div class="timeline-event">
                <h3>[Janeiro]</h3>
                <div class="timeline-images">
                    <div class="location-image-container"
                        style="display: flex; flex-wrap: wrap; justify-content: center;">
                        <img onclick="openModal(this.src)" src="./images/locations/VE/FB_IMG_16346565210839960.jpg"
                            alt="Venezuela" class="location-image" title="Santa Elena de Uairén - Bolivar">
                        <img onclick="openModal(this.src)" src="./images/locations/VE/FB_IMG_16346564772851130.jpg"
                            alt="Venezuela" class="location-image" title="Santa Elena de Uairén - Bolivar">
                        <img onclick="openModal(this.src)" src="./images/locations/VE/FB_IMG_16346564919831579.jpg"
                            alt="Venezuela" class="location-image" title="Santa Elena de Uairén - Bolivar">
                        <img onclick="openModal(this.src)" src="./images/locations/VE/FB_IMG_16346565058898847.jpg"
                            alt="Venezuela" class="location-image" title="Santa Elena de Uairén - Bolivar">
                        <img onclick="openModal(this.src)" src="./images/locations/VE/FB_IMG_16346565141471194.jpg"
                            alt="Venezuela" class="location-image" title="Santa Elena de Uairén - Bolivar">
                        <img onclick="openModal(this.src)" src="./images/locations/VE/FB_IMG_16346555086919480.jpg"
                            alt="Venezuela" class="location-image" title="Santa Elena de Uairén - Bolivar">
                    </div>
                </div>
            </div>
        </div>

        <div id="myModal" class="modal" onclick="closeModal()">
            <div class="modal-content">
                <span class="navigation">
                    <button class="arrow" onclick="prevImage(); event.stopPropagation();"
                        aria-label="Anterior">&#10094;</button>
                    <img id="img01" class="modal-image" />
                    <button class="arrow" onclick="nextImage(); event.stopPropagation();"
                        aria-label="Próximo">&#10095;</button>
                </span>
            </div>
        </div>

        <script src="script.js"></script>
</body>

</html>
