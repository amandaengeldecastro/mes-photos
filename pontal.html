<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pontal do Paraná</title>
    <link rel="stylesheet" href="city-styles.css"> 
  <link rel="stylesheet" href="auth-social.css" />
</head>
<body class="auth-loading" onclick="closeDropdown(event)">
    <div class="nav-wrap">
        <a href="maps.html" class="nav-main-btn">← Voltar</a>
    </div>

    <header>
        <h1>Pontal do Paraná</h1>
        <div class="city-divider"></div>
    </header>
    <div class="timeline">
        <div class="timeline-year" id="year-2026">
            <h2>2026</h2>
            <div class="timeline-event">
                <h3>[Janeiro]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_20260111_175250_085.jpg" alt="Pontal do Paraná" class="location-image">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_20260111_151120_462.jpg" alt="Pontal do Paraná" class="location-image">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_20260111_151315_919.jpg" alt="Pontal do Paraná" class="location-image">
                </div>
            </div>
        </div>
        
        <div class="timeline-year" id="year-2025">
            <h2>2025</h2>
            <div class="timeline-event">
                <h3>[Abril]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/20250426164459569_praia_do_leste_pontal.jpg" alt="Pontal do Paraná" class="location-image" title="Praia do Leste - Pontal do Paraná">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_20241006_121437_124_praia_de_leste_pontal.jpg" alt="Pontal do Paraná" class="location-image" title="Praia de Leste - Pontal do Paraná">
                </div>
            </div>
        </div>
    </div>

    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button> 
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();" aria-label="Próximo">&#10095;</button> 
            </span>
        </div>
    </div>

    <script src="script.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="social.js"></script>
</body>
</html>
