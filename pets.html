<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111110;
      font-family: "DM Sans", sans-serif;
      min-height: 100vh;
    }

    /* — Botão flutuante de voltar — */
    .nav-wrap {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }

    .nav-main-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.7);
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.02em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .nav-main-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .nav-dropdown {
      margin-top: 6px;
      background: rgba(22, 22, 20, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(-6px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .nav-dropdown.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .nav-option {
      display: block;
      width: 100%;
      padding: 9px 16px;
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.65);
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .nav-option:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .nav-option + .nav-option {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* — Cabeçalho — */
    .pets-title-area {
      text-align: center;
      padding: 72px 24px 32px;
    }

    .pets-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .pets-heading {
      font-family: "DM Serif Display", serif;
      font-size: 2.1rem;
      color: #fff;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .pets-divider {
      width: 28px;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 16px auto 0;
    }

    /* — Grade de fotos — */
    .pets-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 28px 20px 60px;
      max-width: 700px;
      margin: 0 auto;
    }

    .pet-card {
      border-radius: 10px;
      aspect-ratio: 1;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* gradiente suave para o nome ficar legível */
    .pet-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    .pet-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: transform 0.35s ease;
    }

    .pet-card:hover img {
      transform: scale(1.05);
    }

    .pet-name {
      position: absolute;
      bottom: 9px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
      z-index: 2;
      letter-spacing: 0.04em;
    }

    /* — Modal — */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* imagem se enquadra em qualquer tela sem cortar */
    .modal-image {
      max-width: 88vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 4px;
    }

    .navigation {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      padding: 0 16px;
      z-index: 10;
    }

    .arrow {
      color: white;
      font-size: 18px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      flex-shrink: 0;
      transition: background 0.2s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .arrow:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    /* — Responsivo — */
    @media (max-width: 600px) {
      .pets-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
        padding: 20px 14px 48px;
      }

      .pets-heading {
        font-size: 1.75rem;
      }

      .modal-image {
        max-width: 94vw;
        max-height: 80vh;
      }

      .arrow {
        width: 36px;
        height: 36px;
        font-size: 15px;
      }

      .navigation {
        padding: 0 8px;
      }
    }

    @media (max-width: 360px) {
      .pets-grid {
        gap: 4px;
        padding: 16px 10px 40px;
      }

      .pets-heading {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body onclick="closeDropdown(event)">

  <!-- Botão flutuante de voltar -->
  <div class="nav-wrap">
    <button class="nav-main-btn" onclick="toggleDropdown(event)">← Voltar</button>
    <div class="nav-dropdown" id="navDropdown">
      <a href="index.html" class="nav-option">Home</a>
      <a href="maps.html" class="nav-option">Maps</a>
    </div>
  </div>

  <!-- Cabeçalho -->
  <div class="pets-title-area">
    <h1 class="pets-heading">Pets</h1>
    <div class="pets-divider"></div>
  </div>

  <!-- Grade de fotos -->
  <div class="pets-grid">
    <div class="pet-card" onclick="openModal(this.querySelector('img').src)">
      <img src="./images/pets/IMG-20240415-WA0002_saller.jpg" alt="Saller" class="location-image" />
      <span class="pet-name">Saller</span>
    </div>
    <div class="pet-card" onclick="openModal(this.querySelector('img').src)">
      <img src="./images/pets/IMG_20240912_121704_362_luiggi.jpg" alt="Luiggi" class="location-image" />
      <span class="pet-name">Luiggi</span>
    </div>
    <div class="pet-card" onclick="openModal(this.querySelector('img').src)">
      <img src="./images/pets/FB_IMG_16346557123456025.jpg" alt="Meg" class="location-image" />
      <span class="pet-name">Meg</span>
    </div>
    <div class="pet-card" onclick="openModal(this.querySelector('img').src)">
      <img src="./images/pets/FB_IMG_16346557196734159.jpg" alt="Olívia" class="location-image" />
      <span class="pet-name">Olívia</span>
    </div>
    <div class="pet-card" onclick="openModal(this.querySelector('img').src)">
      <img src="./images/pets/FB_IMG_16346557435246710.jpg" alt="Sheldy" class="location-image" />
      <span class="pet-name">Sheldy</span>
    </div>
    <div class="pet-card" onclick="openModal(this.querySelector('img').src)">
      <img src="./images/pets/FB_IMG_16346558938852977.jpg" alt="Pipper" class="location-image" />
      <span class="pet-name">Pipper</span>
    </div>
    <div class="pet-card" onclick="openModal(this.querySelector('img').src)">
      <img src="./images/pets/sheldy_smith.jpeg" alt="Smith" class="location-image" />
      <span class="pet-name">Smith</span>
    </div>
    <div class="pet-card" onclick="openModal(this.querySelector('img').src)">
      <img src="./images/pets/frida.jpeg" alt="Frida" class="location-image" />
      <span class="pet-name">Frida</span>
    </div>
  </div>

  <!-- Modal -->
  <div id="myModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <span class="navigation">
        <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
        <img id="img01" class="modal-image" />
        <button class="arrow" onclick="nextImage(); event.stopPropagation();" aria-label="Próximo">&#10095;</button>
      </span>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    function toggleDropdown(e) {
      e.stopPropagation();
      document.getElementById('navDropdown').classList.toggle('open');
    }

    function closeDropdown(e) {
      document.getElementById('navDropdown').classList.remove('open');
    }
  </script>
</body>
</html>
