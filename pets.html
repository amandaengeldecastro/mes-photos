<!DOCTYPE html>

  <title>Pets</title>
  <link rel="stylesheet" href="city-styles.css" />
  <style>
    /* — Cabeçalho — */
    .pets-title-area {
      text-align: center;
      padding: 72px 24px 32px;
    }

    .pets-label {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .pets-heading {
      font-family: "DM Serif Display", serif;
      font-size: 2.1rem;
      color: #fff;
      font-weight: 400;
      letter-spacing: -0.02em;
    }

    .pets-divider {
      width: 28px;
      height: 1px;
      background: rgba(255, 255, 255, 0.2);
      margin: 16px auto 0;
    }

    /* — Grade de fotos — */
    .pets-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 28px 20px 60px;
      max-width: 700px;
      margin: 0 auto;
    }

    .pet-card {
      border-radius: 10px;
      aspect-ratio: 1;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .pet-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    .pet-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: transform 0.35s ease;
    }

    .pet-card:hover img {
      transform: scale(1.05);
    }

    .pet-name {
      position: absolute;
      bottom: 9px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
      z-index: 2;
      letter-spacing: 0.04em;
    }

    /* — Responsivo — */
    @media (max-width: 600px) {
      .pets-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
        padding: 20px 14px 48px;
      }

      .pets-heading {
        font-size: 1.75rem;
      }
    }

    @media (max-width: 360px) {
      .pets-grid {
        gap: 4px;
        padding: 16px 10px 40px;
      }

      .pets-heading {
        font-size: 1.4rem;
      }
    }
  </style>
  <link rel="stylesheet" href="auth-social.css" />
</head>
