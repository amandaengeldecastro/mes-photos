<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>São José</title>
    <link rel="stylesheet" href="city-styles.css">
  <link rel="stylesheet" href="auth-social.css" />
</head>

<body class="auth-loading" onclick="closeDropdown(event)">
    <div class="nav-wrap">
        <a href="maps.html" class="nav-main-btn">← Voltar</a>
    </div>

    <header>
        <h1>São José</h1>
        <div class="city-divider"></div>
    </header>

    <div class="timeline">
        <div class="timeline-year" id="year-2024">
            <h2>2024</h2>
            <div class="timeline-event">
                <h3>[Abril]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SC/IMG-20240422-WA0022_ponta_de_baixo_são_josé.jpg" alt="2024" class="location-image" title="Ponta de Baixo - São José">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();" aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>
  <script src="app.js"></script>
</body>

</html>
