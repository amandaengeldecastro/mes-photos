<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>São Paulo</title>
    <link rel="stylesheet" href="city-styles.css">
</head>

<body onclick="closeDropdown(event)">
    <div class="nav-wrap">
        <button class="nav-main-btn" onclick="toggleDropdown(event)">← Voltar</button>
        <div class="nav-dropdown" id="navDropdown">
            <a href="index.html" class="nav-option">Home</a>
            <a href="maps.html" class="nav-option">Maps</a>
        </div>
    </div>

    <header>
        <h1>São Paulo</h1>
    </header>

    <div class="timeline">
        <div class="timeline-year" id="year-2015">
            <h2>2015</h2>
            <div class="timeline-event">
                <h3>[Fevereiro]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SP/FB_IMG_16346568370881550.jpg"
                        alt="2015" class="location-image" title="Pinacoteca - São Paulo">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SP/FB_IMG_16346568452616292.jpg"
                        alt="2015" class="location-image" title="São Paulo">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/SP/IMG_20150217_163119.jpg"
                        alt="2015" class="location-image" title="São Paulo">
                 </div>
                </div>
            </div>
        </div>

        <div id="myModal" class="modal" onclick="closeModal()">
            <div class="modal-content" onclick="event.stopPropagation()">
                <span class="navigation">
                    <button class="arrow" onclick="prevImage(); event.stopPropagation();"
                        aria-label="Anterior">&#10094;</button>
                    <img id="img01" class="modal-image" />
                    <button class="arrow" onclick="nextImage(); event.stopPropagation();"
                        aria-label="Próximo">&#10095;</button>
                </span>
            </div>
        </div>

        <script src="script.js"></script>
    <script>
        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('navDropdown').classList.toggle('open');
        }
        function closeDropdown(e) {
            document.getElementById('navDropdown').classList.remove('open');
        }
    </script>
</body>

</html>
