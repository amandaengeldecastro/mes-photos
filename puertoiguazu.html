<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puerto Iguazú</title>
    <link rel="stylesheet" href="city-styles.css">
</head>

<body onclick="closeDropdown(event)">
    <div class="nav-wrap">
        <button class="nav-main-btn" onclick="toggleDropdown(event)">← Voltar</button>
        <div class="nav-dropdown" id="navDropdown">
            <a href="index.html" class="nav-option">Home</a>
            <a href="maps.html" class="nav-option">Maps</a>
        </div>
    </div>

    <header>
        <h1>Puerto Iguazú</h1>
    </header>

    <div class="timeline">
        <div class="timeline-year" id="year-2023">
            <h2>2023</h2>
            <div class="timeline-event">
                <h3>[Outubro]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/AR/garganta_del_diablo_puert_iguaze.jpg" alt="Puerto Iguazu" class="location-image" title="Puerto Iguazú">
                    <img onclick="openModal(this.src)" src="./images/locations/AR/IMG_20231006_215913_517_puerto_iguazu.jpg" alt="Puerto Iguazu" class="location-image" title="Hito de Las 3 Fronteras - Puerto Iguazú">
                    <img onclick="openModal(this.src)" src="./images/locations/AR/IMG_20231006_222340_896-EDIT_puerto_iguazu.jpg" alt="Puerto Iguazu" class="location-image" title="Puerto Iguazú">
                    <img onclick="openModal(this.src)" src="./images/locations/AR/IMG_20231006_210639_436.jpg" alt="Puerto Iguazu" class="location-image" title="Puerto Iguazú">
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();" aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>
</body>

</html>
