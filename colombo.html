<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombo</title>
    <link rel="stylesheet" href="city-styles.css">
</head>

<body onclick="closeDropdown(event)">
    <div class="nav-wrap">
        <button class="nav-main-btn" onclick="toggleDropdown(event)">← Voltar</button>
        <div class="nav-dropdown" id="navDropdown">
            <a href="index.html" class="nav-option">Home</a>
            <a href="maps.html" class="nav-option">Maps</a>
        </div>
    </div>

    <header>
        <h1>Colombo</h1>
    </header>

    <div class="timeline">
        <div class="timeline-year" id="year-2024">
            <h2>2024</h2>
            <div class="timeline-event">
                <h3>[Setembro]</h3>
                <div class="timeline-images">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_20240922_132956_344_bacaetava.jpg" alt="Colombo" class="location-image" title="Gruta Bacaetava - Colombo">
                    <img onclick="openModal(this.src)" src="./images/locations/BR/PR/IMG_20240922_133750_226_bacaetava.jpg" alt="Colombo" class="location-image" title="Gruta Bacaetava - Colombo">
                </div>
            </div>
        </div>
    </div>

    <div id="myModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="navigation">
                <button class="arrow" onclick="prevImage(); event.stopPropagation();" aria-label="Anterior">&#10094;</button>
                <img id="img01" class="modal-image" />
                <button class="arrow" onclick="nextImage(); event.stopPropagation();" aria-label="Próximo">&#10095;</button>
            </span>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
